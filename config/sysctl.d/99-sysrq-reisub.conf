# Aktifkan semua fungsi SysRq - supaya kombinasi REISUB berfungsi saat
# sistem beku (pengganti menekan power button).
#
# Pemakaian saat beku (tahan Alt, tekan berurutan pelan):
#   R E I S U B
#   R = keyboard raw, E = SIGTERM semua proses, I = SIGKILL,
#   S = sync disk, U = remount read-only, B = reboot.
#
# Bagian dari rice macos-fedora44 (17 Okt 2026).
# Pasang: sudo cp config/sysctl.d/99-sysrq-reisub.conf /etc/sysctl.d/
#         sudo sysctl -w kernel.sysrq=1
kernel.sysrq=1
